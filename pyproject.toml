[project]
name = "nyaa-qbittorrent-plugin"
version = "0.0.0"
description = "qBittorrent search engine plugins for nyaa.si and sukebei.nyaa.si, generated from a shared stdlib-only core."
readme = "README.md"
# Governs the dev/test environment only (pytest 9 + ruff need >=3.10). The
# *generated plugins* stay 3.9-compatible for older qBittorrent runtimes -- that
# is enforced separately by [tool.ruff] target-version and the stdlib-only code.
requires-python = ">=3.10"
dependencies = ["certifi>=2026.10.19"]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-rerunfailures==15.1",
    "ruff==0.14.4",
]

[tool.pytest.ini_options]
pythonpath = ["src", "tools", "tests"]
markers = [
    "live: hits nyaa.si / sukebei.nyaa.si -- skipped by default, run with -m live",
]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py39"
# shell.py is a template with build-time placeholders (not valid standalone);
# engine/ is generated output.
extend-exclude = ["plugin/shell.py", "engine"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
